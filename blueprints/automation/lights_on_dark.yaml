blueprint:
  name: Lights On When Dark
  description: |
    # Lights On When Dark
    **Version: 2026.8.3**

    Runs actions when it actually gets dark, measured by an illuminance sensor
    instead of guessed from sun elevation.

    <details><summary><b>Details</b></summary>

    Check how often your sensor reports before tuning anything else. Many battery
    sensors send brightness only every few minutes, or only alongside motion.

    A slow sensor needs a higher threshold and a shorter dwell: with sparse
    readings the dwell adds delay without filtering clouds.

    Sunset acts as a fallback whenever the sensor cannot be trusted - unavailable,
    or silent for longer than "Stale after".

    </details>
  domain: automation
  author: NoFutureKid
  source_url: https://github.com/nofuturekid/ha-blueprints/blob/main/blueprints/automation/lights_on_dark.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    required_inputs:
      name: Required parameters
      icon: mdi:alert-box
      description: >
        These inputs are required for the blueprint to function and must be filled in.
      collapsed: false
      input:
        illuminance_entity:
          name: Illuminance sensor
          description: >
            Must not be lit by the lights this automation switches on.
          selector:
            entity:
              multiple: false
              filter:
                device_class:
                  - illuminance

        dark_actions:
          name: Actions
          description: >
            What to run once it is dark. Typically activating a scene.
          selector:
            action:

    optional_parameters:
      name: Optional parameters
      icon: mdi:star-box-multiple
      description: >
        Optional parameters to tune the threshold, the dwell time, the presence
        requirement and the sunset fallback.
      collapsed: true
      input:
        illuminance_threshold:
          name: Threshold
          description: Brightness below which it counts as dark.
          default: 150
          selector:
            number:
              min: 1
              max: 1000
              unit_of_measurement: "lx"
              mode: slider
              step: 1

        dwell_time:
          name: Dwell time
          description: >
            How long it must stay below the threshold. Filters passing clouds,
            but only on sensors that report often.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: "min"
              mode: slider
              step: 1

        presence_entity:
          name: Presence
          description: >
            Only run when one of these signals somebody is around: state 'on',
            'home', or a number above zero, so zone.home works too. Leave empty
            for no presence check.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - zone
                    - person
                    - binary_sensor
                    - input_boolean

        use_sunset_fallback:
          name: Sunset fallback
          description: >
            Also run at sunset, but only while the sensor cannot be trusted.
          default: true
          selector:
            boolean:

        stale_after:
          name: Stale after
          description: >
            Distrust the sensor once its last report is older than this, so the
            sunset fallback takes over. Catches a sensor that stops sending but
            keeps its last value. Set to a few times the normal reporting gap;
            0 disables.
          default: 0
          selector:
            number:
              min: 0
              max: 720
              unit_of_measurement: "min"
              mode: box
              step: 1

mode: single

variables:
  presence_entity: !input presence_entity
  illuminance_entity: !input illuminance_entity
  stale_after: !input stale_after

triggers:
  - trigger: numeric_state
    entity_id: !input illuminance_entity
    below: !input illuminance_threshold
    for:
      minutes: !input dwell_time
    id: dark

  - trigger: sun
    event: sunset
    id: sunset_fallback
    enabled: !input use_sunset_fallback

conditions:
  - condition: template
    alias: Someone is around, or presence was not configured
    value_template: >
      {# An empty presence list means the automation is not gated on presence. #}
      {% if presence_entity | count == 0 %}
        true
      {% else %}
        {# 'on'/'home' covers binary_sensor, person and input_boolean.
           A number above zero covers zones, whose state is the head count. #}
        {% set ns = namespace(present=false) %}
        {% for e in presence_entity %}
          {% set s = states(e) %}
          {% if s in ['on', 'home'] or (s | int(0)) > 0 %}
            {% set ns.present = true %}
          {% endif %}
        {% endfor %}
        {{ ns.present }}
      {% endif %}

  - condition: or
    alias: Darkness measured, or sunset while the sensor cannot be trusted
    conditions:
      - condition: trigger
        id: dark
      - condition: and
        conditions:
          - condition: trigger
            id: sunset_fallback
          - condition: or
            alias: Sensor unreadable, or its last report is too old
            conditions:
              - condition: state
                entity_id: !input illuminance_entity
                state:
                  - unavailable
                  - unknown
              - condition: template
                alias: Sensor went stale without going unavailable
                value_template: >
                  {# last_reported advances on every report, even an unchanged
                     one — unlike last_updated, which would make a legitimately
                     constant reading look frozen. #}
                  {% if stale_after | int(0) > 0 %}
                    {% set s = states[illuminance_entity] %}
                    {{ s is not none
                       and (now() - s.last_reported).total_seconds() > (stale_after | int * 60) }}
                  {% else %}
                    false
                  {% endif %}

actions: !input dark_actions
