blueprint:
  name: Waste Collection Reminder
  description: |
    # Waste Collection Reminder
    **Version: 2026.8.2**

    Sends a notification ahead of each waste collection, naming the bin that
    is due. Works with any calendar whose events are the collections, such as
    the Waste Collection Schedule integration.

    <details><summary><b>How the timing works</b></summary>

    At the chosen time the calendar is asked for the collections on the day
    "Days Ahead" from now. One notification lists every bin due that day;
    nothing is sent when there is none.

    </details>
  domain: automation
  author: NoFutureKid
  source_url: https://github.com/nofuturekid/ha-blueprints/blob/main/blueprints/automation/waste_reminder.yaml
  input:
    # ============= REQUIRED INPUTS =============
    required_inputs:
      name: Required Inputs
      icon: mdi:alert-box
      collapsed: false
      description: These inputs are required for the blueprint to function.
      input:
        calendar:
          name: Waste Calendar
          description: Calendar whose events are the collections
          selector:
            entity:
              filter:
                - domain: calendar

        notify_devices:
          name: Notification Devices
          description: Mobile devices that should receive the reminder (mobile_app integration)
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

    # ============= TIMING =============
    timing_section:
      name: "⏰ Timing"
      icon: mdi:clock-outline
      collapsed: true
      description: When to send the reminder.
      input:
        reminder_time:
          name: Time
          description: Time of day the reminder is sent
          default: "13:00:00"
          selector:
            time:
        days_ahead:
          name: Days Ahead
          description: Which day to look at. 1 is tomorrow, 0 is today.
          default: 1
          selector:
            number:
              min: 0
              max: 7
              mode: box

    # ============= NOTIFICATION =============
    notification_section:
      name: "🔔 Notification"
      icon: mdi:bell-outline
      collapsed: true
      description: Texts and delivery. "{{ bins }}" is replaced by the bin names.
      input:
        title:
          name: Title
          default: "Waste collection tomorrow"
          selector:
            text:
        message:
          name: Message
          default: "Due: {{ bins }}"
          selector:
            text:
        joiner:
          name: Joiner
          description: Word between the last two bin names when several are due
          default: "and"
          selector:
            text:
        channel:
          name: Notification Channel
          description: Android notification channel, so the reminder can get its own sound and importance on the device.
          default: "Waste"
          selector:
            text:

trigger:
  - platform: time
    at: !input reminder_time

action:
  - variables:
      days_ahead: !input days_ahead
      day: "{{ (now() + timedelta(days=days_ahead)).date() }}"

  - service: calendar.get_events
    target:
      entity_id: !input calendar
    data:
      start_date_time: "{{ day }} 00:00:00"
      duration:
        days: 1
    response_variable: result

  - variables:
      calendar: !input calendar
      joiner: !input joiner
      events: "{{ result[calendar]['events'] }}"
      bins: >-
        {% set names = events | map(attribute='summary') | list %}
        {% if names | length > 1 %}{{ names[:-1] | join(', ') }} {{ joiner }} {{ names[-1] }}{% else %}{{ names | join }}{% endif %}
      title: !input title
      message: !input message
      channel: !input channel

  - condition: template
    value_template: "{{ events | length > 0 }}"

  - repeat:
      for_each: !input notify_devices
      sequence:
        - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data:
              tag: "waste_reminder"
              notification_icon: "mdi:trash-can-outline"
              channel: "{{ channel }}"
              importance: high
              priority: high

mode: single
