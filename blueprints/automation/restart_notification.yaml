blueprint:
  name: Restart Notification
  description: |
    # Restart Notification
    **Version: 2026.8.1**

    Notifies the selected devices when Home Assistant starts or shuts down.
  domain: automation
  author: NoFutureKid
  source_url: https://github.com/nofuturekid/ha-blueprints/blob/main/blueprints/automation/restart_notification.yaml
  input:
    target_devices:
      name: Target Devices
      description: "Select the devices to send the notification to"
      selector:
        device:
          integration: mobile_app
    start_message:
      name: Start Message
      description: "Message to send when Home Assistant starts"
      default: "Home Assistant is starting."
    shutdown_message:
      name: Shutdown Message
      description: "Message to send when Home Assistant shuts down"
      default: "Home Assistant is shutting down."

trigger:
  - platform: homeassistant
    event: start

  - platform: homeassistant
    event: shutdown

condition:
  - condition: template
    value_template: "{{ target_devices | length > 0 }}"

action:
  - service: notify.dummy
    data:
      message: "This is a dummy service to avoid YAML parsing errors"
  - service: notify.notify
    data:
      message: >
        {% if trigger.event.data.id == 'start' %}
          {{ input('start_message') }}
        {% elif trigger.event.data.id == 'shutdown' %}
          {{ input('shutdown_message') }}
        {% endif %}
    target:
      entity_id: '{{ target_devices | join(",") }}'
