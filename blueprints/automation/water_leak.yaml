blueprint:
  name: Water Leak Alert
  description: |
    # Water Leak Alert
    **Version: 2026.8.4**

    Sends a one-time notification when a water leak or moisture sensor triggers,
    with separate settings and texts for each.

    <details><summary><b>Notification delivery</b></summary>

    "priority" is the FCM delivery priority and accepts only normal and high.
    Anything else counts as normal and will not wake a dozing phone. Channel
    loudness is "importance", where max is valid.

    No "ttl" is set on purpose: ttl 0 means deliver now or discard, so an alert
    would be lost whenever the phone is out of coverage. For a leak, late beats
    never.

    Android overrides Do Not Disturb per notification channel, and that override
    has to be granted once on the device. Set a channel name below, then allow
    "Override Do Not Disturb" for it under Settings > Apps > Home Assistant >
    Notifications.

    </details>
  domain: automation
  author: NoFutureKid
  source_url: https://github.com/nofuturekid/ha-blueprints/blob/main/blueprints/automation/water_leak.yaml
  input:
    # ============= REQUIRED INPUTS =============
    required_inputs:
      name: Required Inputs
      icon: mdi:alert-box
      collapsed: false
      description: These inputs are required for the blueprint to function.
      input:
        water_leak_sensors:
          name: Water Leak Sensors
          description: One or more water leak sensors (moisture device_class)
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: moisture
              multiple: true

        moisture_sensors:
          name: Moisture Sensors
          description: One or more moisture sensors (moisture device_class)
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: moisture
              multiple: true

        notify_devices:
          name: Notification Devices
          description: Mobile devices that should receive notifications (mobile_app integration)
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

    # ============= MOISTURE CONFIGURATION =============
    moisture_section:
      name: "💦 Moisture Settings"
      icon: mdi:water-percent
      collapsed: true
      description: Configure notification for moisture alerts.
      input:
        moisture_title:
          name: Notification Title
          description: Title for moisture notifications
          default: "⚠️ MOISTURE DETECTED!"
          selector:
            text:

        moisture_message:
          name: Notification Text
          description: Message text for moisture notifications (available {{sensor_name}}, {{area_name}})
          default: "💦 [{{ area_name }}] {{ sensor_name }} detected moisture!"
          selector:
            text:
              multiline: true

        moisture_bypass_dnd:
          name: Use a dedicated notification channel
          description: >
            Sends moisture alerts on their own Android notification channel,
            so you can grant it "Override Do Not Disturb" on the device.
          default: false
          selector:
            boolean:

        moisture_channel:
          name: Channel name
          description: Only used when the dedicated channel is enabled above.
          default: "Moisture"
          selector:
            text:

    # ============= WATER LEAK CONFIGURATION =============
    water_leak_section:
      name: "🚨 Water Leak Settings"
      icon: mdi:water-alert
      collapsed: true
      description: Configure notification for water leak alerts.
      input:
        water_leak_title:
          name: Notification Title
          description: Title for water leak notifications
          default: "🚨 WATER LEAK DETECTED!"
          selector:
            text:

        water_leak_message:
          name: Notification Text
          description: Message text for water leak notifications (available {{sensor_name}}, {{area_name}})
          default: "💧 [{{ area_name }}] {{ sensor_name }} detected a water leak!"
          selector:
            text:
              multiline: true

        water_leak_bypass_dnd:
          name: Use a dedicated notification channel
          description: >
            Sends leak alerts on their own Android notification channel, so
            you can grant it "Override Do Not Disturb" on the device.
          default: true
          selector:
            boolean:

        water_leak_channel:
          name: Channel name
          description: Only used when the dedicated channel is enabled above.
          default: "Water Leak"
          selector:
            text:

        water_leak_tts:
          name: Also speak the alert out loud
          description: >
            Sends an additional text-to-speech notification over the alarm
            stream at maximum volume, which is audible even when the ringer
            is silenced. Leak alerts only.
          default: false
          selector:
            boolean:

trigger:
  - platform: state
    entity_id: !input water_leak_sensors
    to: "on"
    id: "water_leak_alarm"
  - platform: state
    entity_id: !input moisture_sensors
    to: "on"
    id: "moisture_alarm"

action:
  - variables:
      sensor_name: "{{ state_attr(trigger.entity_id, 'friendly_name') }}"
      area_name: "{{ area_name(trigger.entity_id) }}"
      tag: "alert_{{ trigger.entity_id | replace('.', '_') }}"
      water_leak_title: !input water_leak_title
      water_leak_message: !input water_leak_message
      water_leak_bypass_dnd: !input water_leak_bypass_dnd
      water_leak_channel: !input water_leak_channel
      water_leak_tts: !input water_leak_tts
      moisture_title: !input moisture_title
      moisture_message: !input moisture_message
      moisture_bypass_dnd: !input moisture_bypass_dnd
      moisture_channel: !input moisture_channel

  - choose:
      # MOISTURE ALARM
      - conditions:
          - condition: trigger
            id: "moisture_alarm"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ moisture_bypass_dnd }}"
                sequence:
                  - repeat:
                      for_each: !input notify_devices
                      sequence:
                        - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                          data:
                            title: "{{ moisture_title }}"
                            message: "{{ moisture_message }}"
                            data:
                              tag: "{{ tag }}"
                              notification_icon: "mdi:water-percent"
                              channel: "{{ moisture_channel }}"
                              importance: high
                              priority: high
                              interruption_level: critical
            default:
              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                      data:
                        title: "{{ moisture_title }}"
                        message: "{{ moisture_message }}"
                        data:
                          tag: "{{ tag }}"
                          notification_icon: "mdi:water-percent"
                          importance: high
                          priority: high
      # WATER LEAK ALARM
      - conditions:
          - condition: trigger
            id: "water_leak_alarm"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ water_leak_bypass_dnd }}"
                sequence:
                  - repeat:
                      for_each: !input notify_devices
                      sequence:
                        - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                          data:
                            title: "{{ water_leak_title }}"
                            message: "{{ water_leak_message }}"
                            data:
                              tag: "{{ tag }}"
                              notification_icon: "mdi:water-alert"
                              channel: "{{ water_leak_channel }}"
                              importance: max
                              priority: high
                              interruption_level: critical
            default:
              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                      data:
                        title: "{{ water_leak_title }}"
                        message: "{{ water_leak_message }}"
                        data:
                          tag: "{{ tag }}"
                          notification_icon: "mdi:water-alert"
                          importance: max
                          priority: high
          # Spoken alert over the alarm stream - leak only, and audible even
          # when the ringer is silenced. Sent in addition to the notification
          # above, not instead of it.
          - if: "{{ water_leak_tts }}"
            then:
              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - service: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                      data:
                        message: TTS
                        data:
                          tts_text: "{{ water_leak_message }}"
                          media_stream: alarm_stream_max
                          # Without priority the spoken alert is an ordinary
                          # FCM message and will not wake a dozing phone. It
                          # only appeared to work while the notification sent
                          # just before it happened to hold the device awake.
                          priority: high
                          channel: "{{ water_leak_channel }}"

mode: single
