blueprint:
  name: Climate Schedule
  description: |
    # Climate Schedule
    **Version: 2026.8.6**

    Applies a climate preset at a scheduled time. Use one automation per
    preset, so day and night can be turned on and off separately.

    <details><summary><b>Details</b></summary>

    An alternate time is optional. Switched on, a binary sensor decides which
    of the two times applies - and you pick which way round, because that
    depends on the sensor: a workday sensor is "on" on the days that want the
    normal time, a holiday toggle is "on" on the days that want the alternate
    one. Off by default, the schedule then always runs at "Time".

    Any binary sensor works: a workday sensor, a holiday or vacation toggle, a
    presence sensor - whatever should shift the schedule.

    For a day and night pair driven by workday sensors, give the day automation
    a "today" sensor and the night automation a "tomorrow" one, so an early
    start only happens when it is actually needed.

    Each run can optionally turn some switches on and others off.

    </details>
  domain: automation
  author: NoFutureKid
  source_url: https://github.com/nofuturekid/ha-blueprints/blob/main/blueprints/automation/climate_schedule.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    climate:
      name: Climate
      icon: mdi:air-conditioner
      input:
        climate_entity:
          name: Climate device
          description: >
            The climate device this schedule controls.
          selector:
            entity:
              filter:
                domain: climate
        hvac_mode:
          name: HVAC mode
          description: >
            Applied every time this schedule runs.
          default: cool
          selector:
            select:
              options:
                - "off"
                - cool
                - heat
                - dry
                - fan_only
                - auto
                - heat_cool
        temperature:
          name: Target temperature
          description: >
            Applied every time this schedule runs.
          default: 21
          selector:
            number:
              min: 12
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      input:
        time:
          name: Time
          description: >
            When this schedule runs, unless the alternate time below takes
            over.
          selector:
            time: {}
    alternate:
      name: Alternate time
      icon: mdi:clock-outline
      collapsed: true
      input:
        use_alternate_time:
          name: When to use it
          description: >
            Whether a second time applies at all, and in which sensor state.
            With "Never" the two fields below are ignored.
          default: disabled
          selector:
            select:
              options:
                - label: Never
                  value: disabled
                - label: While the deciding sensor is off
                  value: enabled
                - label: While the deciding sensor is on
                  value: enabled_inverted
        deciding_sensor:
          name: Deciding sensor
          description: >
            Binary sensor that decides which of the two times applies; the
            direction is set above. A workday sensor, a holiday toggle,
            anything. Several may be picked, all then have to agree.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
        alternate_time:
          name: Alternate time
          description: >
            Used instead of "Time" while the deciding sensor is in the state
            picked above.
          default: "09:00:00"
          selector:
            time: {}
    switches:
      name: Switches
      icon: mdi:toggle-switch
      collapsed: true
      input:
        switches_on:
          name: Switches to turn ON
          description: >
            Switches to turn on when this schedule runs.
          default: []
          selector:
            entity:
              filter:
                domain: switch
              multiple: true
        switches_off:
          name: Switches to turn OFF
          description: >
            Switches to turn off when this schedule runs.
          default: []
          selector:
            entity:
              filter:
                domain: switch
              multiple: true

mode: single

# !input cannot be used inside a Jinja expression, so the inputs read below are
# bound to variables first. use_alternate_time is needed before the triggers are
# set up, which is what trigger_variables is for.
trigger_variables:
  use_alternate_time: !input use_alternate_time

variables:
  use_alternate_time: !input use_alternate_time
  switches_on: !input switches_on
  switches_off: !input switches_off

triggers:
  - trigger: time
    at: !input time
    id: main
  - trigger: time
    at: !input alternate_time
    id: alternate
    # Without the alternate time there is no second trigger to set up at all,
    # rather than one that gets discarded on every run.
    enabled: "{{ use_alternate_time != 'disabled' }}"

conditions:
  # Deliberately not gated with `enabled:`. That template is evaluated when the
  # automation is loaded, and only trigger_variables are in scope there - the
  # variables: block is not. use_alternate_time came out undefined, the whole
  # block counted as disabled, and the schedule ran on both times unfiltered.
  # Runtime conditions do see variables:, so the mode check belongs here.
  - condition: or
    conditions:
      # "Never": the second trigger is not set up, so only "main" can fire. Its
      # id is checked anyway, so this stays correct even if the trigger were
      # ever set up regardless.
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ use_alternate_time == 'disabled' }}"
          - condition: trigger
            id: main
      # Alternate while the sensor is off.
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ use_alternate_time == 'enabled' }}"
          - condition: trigger
            id: main
          - condition: state
            entity_id: !input deciding_sensor
            state: "on"
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ use_alternate_time == 'enabled' }}"
          - condition: trigger
            id: alternate
          - condition: state
            entity_id: !input deciding_sensor
            state: "off"
      # Alternate while the sensor is on.
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ use_alternate_time == 'enabled_inverted' }}"
          - condition: trigger
            id: main
          - condition: state
            entity_id: !input deciding_sensor
            state: "off"
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ use_alternate_time == 'enabled_inverted' }}"
          - condition: trigger
            id: alternate
          - condition: state
            entity_id: !input deciding_sensor
            state: "on"

actions:
  - action: climate.set_hvac_mode
    target:
      entity_id: !input climate_entity
    data:
      hvac_mode: !input hvac_mode
  - action: climate.set_temperature
    target:
      entity_id: !input climate_entity
    data:
      temperature: !input temperature
  - if: "{{ switches_on | count > 0 }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ switches_on }}"
  - if: "{{ switches_off | count > 0 }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: "{{ switches_off }}"
