blueprint:
  name: Climate Schedule
  description: |
    # Climate Schedule
    **Version: 2026.8.5**

    Applies a climate preset at a scheduled time. Use one automation per
    preset, so day and night can be turned on and off separately.

    <details><summary><b>Details</b></summary>

    An alternate time is optional. Enabled, a binary sensor decides which of
    the two times applies: while it is "on" the schedule runs at "Time", while
    it is "off" it runs at the alternate time. Disabled, the schedule always
    runs at "Time".

    Any binary sensor works: a workday sensor, a holiday or vacation toggle, a
    presence sensor - whatever should shift the schedule.

    For a day and night pair driven by workday sensors, give the day automation
    a "today" sensor and the night automation a "tomorrow" one, so an early
    start only happens when it is actually needed.

    Each run can optionally turn some switches on and others off.

    </details>
  domain: automation
  author: NoFutureKid
  source_url: https://github.com/nofuturekid/ha-blueprints/blob/main/blueprints/automation/climate_schedule.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    climate:
      name: Climate
      icon: mdi:air-conditioner
      input:
        climate_entity:
          name: Climate device
          description: >
            The climate device this schedule controls.
          selector:
            entity:
              filter:
                domain: climate
        hvac_mode:
          name: HVAC mode
          description: >
            Applied every time this schedule runs.
          default: cool
          selector:
            select:
              options:
                - "off"
                - cool
                - heat
                - dry
                - fan_only
                - auto
                - heat_cool
        temperature:
          name: Target temperature
          description: >
            Applied every time this schedule runs.
          default: 21
          selector:
            number:
              min: 12
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      input:
        time:
          name: Time
          description: >
            When this schedule runs. With an alternate time enabled below, this
            is the time used while the deciding sensor is "on".
          selector:
            time: {}
    alternate:
      name: Alternate time
      icon: mdi:clock-outline
      collapsed: true
      input:
        use_alternate_time:
          name: Enable alternate time
          description: >
            Run at a second time whenever the deciding sensor is "off". Leave
            this disabled to always run at "Time" - the two fields below are
            then ignored.
          default: disabled
          selector:
            select:
              options:
                - label: Enabled
                  value: enabled
                - label: Disabled
                  value: disabled
        deciding_sensor:
          name: Deciding sensor
          description: >
            Binary sensor that picks the time: "on" runs the schedule at
            "Time", "off" at the alternate time - a workday sensor, a holiday
            toggle, anything. Several may be picked, all then have to agree.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor
        alternate_time:
          name: Alternate time
          description: >
            Used instead of "Time" while the deciding sensor is "off".
          default: "09:00:00"
          selector:
            time: {}
    switches:
      name: Switches
      icon: mdi:toggle-switch
      collapsed: true
      input:
        switches_on:
          name: Switches to turn ON
          description: >
            Switches to turn on when this schedule runs.
          default: []
          selector:
            entity:
              filter:
                domain: switch
              multiple: true
        switches_off:
          name: Switches to turn OFF
          description: >
            Switches to turn off when this schedule runs.
          default: []
          selector:
            entity:
              filter:
                domain: switch
              multiple: true

mode: single

# !input cannot be used inside a Jinja expression, so the inputs read below are
# bound to variables first. use_alternate_time is needed before the triggers are
# set up, which is what trigger_variables is for.
trigger_variables:
  use_alternate_time: !input use_alternate_time

variables:
  use_alternate_time: !input use_alternate_time
  switches_on: !input switches_on
  switches_off: !input switches_off

triggers:
  - trigger: time
    at: !input time
    id: main
  - trigger: time
    at: !input alternate_time
    id: alternate
    # Without the alternate time there is no second trigger to set up at all,
    # rather than one that gets discarded on every run.
    enabled: "{{ use_alternate_time == 'enabled' }}"

conditions:
  # Deliberately not gated with `enabled:`. That template is evaluated when the
  # automation is loaded, and only trigger_variables are in scope there - the
  # variables: block is not. use_alternate_time came out undefined, the whole
  # block counted as disabled, and the schedule ran on both times unfiltered.
  # Runtime conditions do see variables:, so the mode check belongs here.
  - condition: or
    conditions:
      # Without the alternate time the second trigger is not set up, so only
      # "main" can fire. Its id is checked anyway, so this stays correct even
      # if the trigger were ever set up regardless.
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ use_alternate_time != 'enabled' }}"
          - condition: trigger
            id: main
      # With the alternate time, the trigger that fired must match the sensor.
      - condition: and
        conditions:
          - condition: trigger
            id: main
          - condition: state
            entity_id: !input deciding_sensor
            state: "on"
      - condition: and
        conditions:
          - condition: trigger
            id: alternate
          - condition: state
            entity_id: !input deciding_sensor
            state: "off"

actions:
  - action: climate.set_hvac_mode
    target:
      entity_id: !input climate_entity
    data:
      hvac_mode: !input hvac_mode
  - action: climate.set_temperature
    target:
      entity_id: !input climate_entity
    data:
      temperature: !input temperature
  - if: "{{ switches_on | count > 0 }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ switches_on }}"
  - if: "{{ switches_off | count > 0 }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: "{{ switches_off }}"
