blueprint:
  name: Climate Workday Schedule
  description: |
    Version: 2026.8.0
    
    Applies a climate setting (HVAC mode + target temperature) at two
    configurable times: one for when a workday binary sensor is ON, and
    one for when it is OFF. Pair with a "today" workday sensor for a
    morning schedule or a "tomorrow" sensor for an evening schedule.
    Optionally turns some switches on and others off. Create one
    automation per mode (e.g. Day Mode and Night Mode).
  domain: automation
  author: NoFutureKid
  source_url: https://github.com/nofuturekid/ha-blueprints/blob/main/blueprints/automation/climate_workday.yaml
  input:
    climate_entity:
      name: Climate device
      selector:
        entity:
          filter:
            domain: climate
    workday_sensor:
      name: Workday sensor
      description: >
        Binary sensor that is "on" when the relevant day is a workday.
        Use a "today" sensor for a morning schedule, a "tomorrow" sensor
        for an evening schedule.
      selector:
        entity:
          filter:
            domain: binary_sensor
    time_workday:
      name: Time when workday sensor is ON
      default: "21:00:00"
      selector:
        time: {}
    time_dayoff:
      name: Time when workday sensor is OFF
      default: "22:00:00"
      selector:
        time: {}
    hvac_mode:
      name: HVAC mode
      default: cool
      selector:
        select:
          options:
            - "off"
            - cool
            - heat
            - dry
            - fan_only
            - auto
            - heat_cool
    temperature:
      name: Target temperature
      default: 19
      selector:
        number:
          min: 12
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    switches_on:
      name: Switches to turn ON (optional)
      default: []
      selector:
        entity:
          filter:
            domain: switch
          multiple: true
    switches_off:
      name: Switches to turn OFF (optional)
      default: []
      selector:
        entity:
          filter:
            domain: switch
          multiple: true

mode: single

variables:
  switches_on: !input switches_on
  switches_off: !input switches_off

triggers:
  - trigger: time
    at: !input time_workday
    id: workday
  - trigger: time
    at: !input time_dayoff
    id: dayoff

conditions:
  - condition: or
    conditions:
      - condition: and
        conditions:
          - condition: trigger
            id: workday
          - condition: state
            entity_id: !input workday_sensor
            state: "on"
      - condition: and
        conditions:
          - condition: trigger
            id: dayoff
          - condition: state
            entity_id: !input workday_sensor
            state: "off"

actions:
  - action: climate.set_hvac_mode
    target:
      entity_id: !input climate_entity
    data:
      hvac_mode: !input hvac_mode
  - action: climate.set_temperature
    target:
      entity_id: !input climate_entity
    data:
      temperature: !input temperature
  - if: "{{ switches_on | count > 0 }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ switches_on }}"
  - if: "{{ switches_off | count > 0 }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: "{{ switches_off }}"
